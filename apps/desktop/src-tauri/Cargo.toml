[package]
name = "projo-desktop"
version = "0.1.0"
description = "projo desktop: the projo web app over libmpv"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
libloading = "0.8.9"
raw-window-handle = "0.6.2"
url = "2.5.8"
ureq = { version = "3.5.1", default-features = false, features = [
  "native-tls-no-default",
  "platform-verifier",
] }
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
