[package]
name = "projo-desktop"
# The app's version is apps/desktop/package.json's (tauri.conf.json reads it): this one is unused.
version = "0.0.0"
description = "projo desktop: the projo web app, bundled, over libmpv"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
libloading = "0.8.9"
raw-window-handle = "0.6.2"
url = "2.5.8"
ureq = { version = "3.5.1", default-features = false, features = [
  "native-tls-no-default",
  "platform-verifier",
] }
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }
# A second launch focuses the running app instead of starting another process (§28.4).
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(windows)'.dependencies]
# The session token in the Credential Manager (token.rs), the native backend only.
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
# The computer's name (device.rs), the user's locale (tray.rs) and the system media controls
# (media_session.rs), the window's maximized state (main_window.rs): the version wry already uses.
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics_Imaging",
  "Media",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
# The webview's context menu and accelerator keys (webview_settings.rs): the version wry and Tauri
# use, so that the controller Tauri hands over has this crate's types.
webview2-com = "=0.39.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The session token in the login keychain (token.rs).
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
# The picture's layer under the webview (mpv/gl_layer.rs): libmpv cannot embed into another app's
# view on macOS, so the app draws it through libmpv's OpenGL render API. The versions wry and Tauri
# use.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSGeometry",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "NSGraphics",
  "NSOpenGLView",
  "NSResponder",
  "NSScreen",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "CAOpenGLLayer",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-video",
  "objc2-open-gl",
] }
objc2-open-gl = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGLCurrent",
  "CGLTypes",
] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CFString",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGColorSpace",
] }
dispatch2 = "=0.3.1"

[profile.release]
codegen-units = 1
lto = true
