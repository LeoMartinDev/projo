[package]
name = "projo-desktop"
# The app's version is apps/desktop/package.json's (tauri.conf.json reads it): this one is unused.
version = "0.0.0"
description = "projo desktop: the projo web app, bundled, over libmpv"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
libloading = "0.8.9"
raw-window-handle = "0.6.2"
url = "2.5.8"
ureq = { version = "3.5.1", default-features = false, features = [
  "native-tls-no-default",
  "platform-verifier",
] }
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
# The session token in the Credential Manager (token.rs), the native backend only.
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
# The computer's name (device.rs) and the user's locale (tray.rs): the version wry already uses.
windows = { version = "0.62.2", features = [
  "Win32_Globalization",
  "Win32_System_SystemInformation",
] }

[profile.release]
codegen-units = 1
lto = true
