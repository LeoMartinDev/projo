<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>projo</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"><div class="backdrop__image"></div></div>
    <div class="titlebar" data-tauri-drag-region>
      <button class="titlebar__button" id="minimize" type="button">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" /></svg>
      </button>
      <button class="titlebar__button" id="maximize" type="button">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5h9v9h-9z" /></svg>
      </button>
      <button class="titlebar__button titlebar__button--close" id="close" type="button">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" /></svg>
      </button>
    </div>
    <header class="setup__header rise" data-tauri-drag-region>
      <span class="setup__logo">projo<span class="setup__dot">.</span></span>
    </header>
    <main class="setup">
      <form class="panel setup__panel rise r2" id="form" novalidate>
        <h1 class="setup__title" id="title"></h1>
        <div class="field" id="field">
          <span class="field__icon" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="7" rx="2" />
              <rect x="3" y="13" width="18" height="7" rx="2" />
              <path d="M7 7.5h.01M7 16.5h.01" />
            </svg>
          </span>
          <div class="field__stack">
            <label class="field__label" for="url" id="url-label"></label>
            <input
              class="field__input"
              id="url"
              name="url"
              type="text"
              inputmode="url"
              autocomplete="url"
              spellcheck="false"
              autocapitalize="off"
              placeholder="http://192.168.1.10:8080"
            />
          </div>
        </div>
        <p class="setup__message" id="message" role="status"></p>
        <button class="button button--primary button--large" id="submit" type="submit">
          <span class="spinner" id="spinner" aria-hidden="true" hidden></span>
          <span id="submit-label"></span>
        </button>
      </form>
    </main>
  </body>
</html>
