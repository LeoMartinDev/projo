<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>{{ t.meta.changelogTitle }}</title>
    <meta name="description" content="{{ t.meta.changelogDescription }}" />
    <link vite-ignore rel="canonical" href="{{ url.self }}" />
    <link vite-ignore rel="alternate" hreflang="en" href="{{ url.en }}" />
    <link vite-ignore rel="alternate" hreflang="fr" href="{{ url.fr }}" />
    <link vite-ignore rel="alternate" hreflang="x-default" href="{{ url.en }}" />
    <link rel="icon" href="/icons/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link button button--primary" href="#content">{{ t.nav.skip }}</a>

    <nav class="docs-nav" aria-label="{{ t.nav.main }}">
      <div class="docs-nav__brand">
        <a class="nav__logo" href="{{ home }}" aria-label="{{ t.nav.homeLabel }}">

            width="112"

            aria-hidden="true"

                />
              </g>
              <g transform="translate(1572 0)">
                <path
                  d="M-3 -150L-3 -38L57 -38Q86 -38 101 -26Q116 -14 116 22L116 536L266 536L266 18Q266 -72 225.5 -111Q185 -150 87 -150L-3 -150Z"

              </g>

          </svg>
        </a>
        <span class="docs-nav__label">{{ t.changelog.title }}</span>
      </div>
      <div class="docs-nav__links">
        <a class="docs-nav__link" href="{{ home }}">{{ t.nav.home }}</a>
        <a class="docs-nav__link docs-nav__link--wide" href="{{ installation }}"
          >{{ t.nav.docs }}</a
        >
        <a
          class="lang lang--plain"
          href="{{ switch.href }}"
          hreflang="{{ switch.lang }}"
          lang="{{ switch.lang }}"
          data-lang="{{ switch.lang }}"
          aria-label="{{ switch.name }}"
          >{{ switch.code }}</a
        >
        <a class="docs-nav__link docs-nav__link--well" href="https://github.com/LeoMartinDev/projo"
          >{{ t.nav.github }}</a
        >
      </div>
    </nav>

    <header class="docs-hero docs-hero--releases">
      <div class="docs-hero__image" aria-hidden="true">
        <img
          class="photo"
          src="{{ photo.city.src }}"
          srcset="{{ photo.city.srcset }}"
          sizes="(max-width: 540px) 540px, 100vw"
          alt=""
          fetchpriority="high"
        />
      </div>
      <div class="docs-hero__content">
        <h1>{{ t.changelog.title }}</h1>
        <p>{{ t.changelog.lead }}</p>
      </div>
    </header>

    <main class="changelog" id="content">{{ releases }}</main>
  </body>
</html>
