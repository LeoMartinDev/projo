[install]
exact = true

[test]
root = "."

[fmt]
printWidth = 100
semi = false
singleQuote = true
trailingComma = "all"
ignorePatterns = [
  "apps/server/drizzle/meta/",
  "design/",
  "bun.lock",
  "PRODUCT.md",
  "README.md",
  "e2e/tmp/",
  "e2e/test-results/",
  "e2e/playwright-report/",
  "apps/mobile/.expo/",
  "apps/mobile/.api-type/",
  "apps/mobile/ios/",
  "apps/mobile/android/",
]

# bun lint enforces PRODUCT.md §5.3. See CLAUDE.md for the rules in prose.
# Overrides apply in order: a later matching override replaces a rule set earlier.
[lint]
ignorePatterns = [
  "dist/",
  ".data/",
  "apps/server/drizzle/",
  "design/",
  "**/*.d.ts",
  "e2e/tmp/",
  "e2e/test-results/",
  "e2e/playwright-report/",
  "apps/mobile/.expo/",
  "apps/mobile/.api-type/",
  "apps/mobile/ios/",
  "apps/mobile/android/",
]

[lint.rules]
"no-restricted-syntax" = [
  "error",
  { selector = "ClassDeclaration", message = "No classes (§5.3): use curried factories and closures." },
  { selector = "ClassExpression", message = "No classes (§5.3): use curried factories and closures." },
  { selector = 'Literal[raw="null"]', message = "No null (§5.3): use undefined. NULL only in infrastructure/sqlite/." },
  { selector = "TSNullKeyword", message = "No null type (§5.3): use T | undefined or an optional property." },
]
"typescript/no-unused-vars" = [
  "error",
  { argsIgnorePattern = "^_", varsIgnorePattern = "^_", caughtErrors = "none" },
]
"typescript/consistent-type-imports" = ["error", { fixStyle = "inline-type-imports" }]
"eqeqeq" = ["error", "always"]
"no-empty" = ["warn", { allowEmptyCatch = true }]
"import/no-restricted-paths" = [
  "error",
  { zones = [
    { target = "./apps/server/src/core", from = "./apps/server/src/application", message = "core/ imports nothing but core/ and @projo/shared." },
    { target = "./apps/server/src/core", from = "./apps/server/src/infrastructure", message = "core/ imports nothing but core/ and @projo/shared." },
    { target = "./apps/server/src/core", from = "./apps/server/src/entrypoints", message = "core/ imports nothing but core/ and @projo/shared." },
    { target = "./apps/server/src/application", from = "./apps/server/src/infrastructure", message = "application/ depends on ports (core/), never on adapters." },
    { target = "./apps/server/src/application", from = "./apps/server/src/entrypoints", message = "application/ never imports entrypoints/." },
    { target = "./apps/server/src/infrastructure", from = "./apps/server/src/application", message = "infrastructure/ implements core/ ports; it never imports application/." },
    { target = "./apps/server/src/infrastructure", from = "./apps/server/src/entrypoints", message = "infrastructure/ never imports entrypoints/." },
    { target = "./packages/shared", from = "./apps", message = "packages/shared never imports an app." },
    { target = "./packages/i18n", from = "./apps", message = "packages/i18n never imports an app." },
    { target = "./packages/design", from = "./apps", message = "packages/design never imports an app." },
    { target = "./packages/player", from = "./apps", message = "packages/player never imports an app." },
    { target = "./packages/web-app", from = "./apps", except = ["./server/src/entrypoints/http/api-type.ts"], message = "packages/web-app never imports an app (the server only for its AppType, as a type)." },
    { target = "./packages/player/src/core", from = ["./packages/player/src/application", "./packages/player/src/testing"], message = "@projo/player core/ imports nothing but core/ and @projo/shared." },
    { target = "./packages/web-app/src/features/player/ui", from = "./packages/web-app/src/features/player/engines", message = "The player UI never imports an engine: it reads engine.capabilities (the host picks the engine, AppHost.playerEngine)." },
    { target = "./packages/web-app/src/features/player/engines/mpv", from = "./packages/web-app/src/features/player/engines/html-video", message = "Engines never import each other." },
    { target = "./packages/web-app/src/features/player/engines/html-video", from = "./packages/web-app/src/features/player/engines/mpv", message = "Engines never import each other." },
    { target = ["./packages/web-app/src/*.{ts,tsx}", "./packages/web-app/src/!(desktop|features)/**", "./packages/web-app/src/features/!(player)/**", "./packages/web-app/src/features/player/*.{ts,tsx}", "./packages/web-app/src/features/player/!(engines)/**", "./packages/web-app/src/features/player/engines/!(mpv)/**"], from = ["./packages/web-app/src/desktop", "./packages/web-app/src/features/player/engines/mpv"], message = "Desktop-only code (src/desktop/, the mpv engine) is reached only through its exports (@projo/web-app/desktop/*, @projo/web-app/engines/mpv), by the desktop host: the app goes through AppHost." },
    { target = ["./apps/web/*.ts", "./apps/web/vite-plugins/**", "./apps/web/src/*.{ts,tsx}", "./apps/web/src/!(desktop-compat)/**"], from = ["./packages/web-app/src/desktop", "./packages/web-app/src/features/player/engines/mpv"], message = "The browser host never loads desktop-only code (Tauri, libmpv): it stays out of the browser bundle. Only the transitional src/desktop-compat/ chunk may (old desktop apps on the server's page, §28)." },
    { target = "./apps/web/src/desktop-compat", from = "./packages/web-app/src/features/player/engines/mpv", message = "TRANSITIONAL desktop-compat (old desktop apps, §28, removed once they are gone): window buttons, update banner and About only, never the mpv engine." },
    { target = "./apps/web", from = ["./apps/www", "./apps/mobile", "./apps/desktop"], message = "An app never imports another app: share it through a package (@projo/design, @projo/i18n, @projo/shared, @projo/web-app)." },
    { target = "./apps/www", from = ["./apps/web", "./apps/mobile", "./apps/desktop"], message = "An app never imports another app: share it through a package (@projo/design, @projo/i18n, @projo/shared, @projo/web-app)." },
    { target = "./apps/mobile", from = ["./apps/web", "./apps/www", "./apps/desktop"], message = "An app never imports another app: share it through a package (@projo/design, @projo/i18n, @projo/shared, @projo/web-app)." },
    { target = "./apps/desktop", from = ["./apps/web", "./apps/www", "./apps/mobile"], message = "An app never imports another app: share it through a package (@projo/design, @projo/i18n, @projo/shared, @projo/web-app)." },
  ] },
]

# ── Server layers ────────────────────────────────────────────────────────────

# core/ and application/: only relative imports, @projo/shared and bun:test (tests).
[[lint.overrides]]
files = ["apps/server/src/core/**/*.ts", "apps/server/src/application/**/*.ts"]
rules = { "no-restricted-imports" = [
  "error",
  { patterns = [
    { regex = '^(?!\.{1,2}/|@projo/shared(?:/|$)|bun:test$)', message = "core/ and application/ import only core/, @projo/shared (and application/ → core/). No package, no node:/bun: module (§5.3)." },
  ] },
] }

[[lint.overrides]]
files = ["apps/server/**/*.ts"]
rules = { "no-restricted-syntax" = [
  "error",
  { selector = "ClassDeclaration", message = "No classes (§5.3): use curried factories and closures." },
  { selector = "ClassExpression", message = "No classes (§5.3): use curried factories and closures." },
  { selector = 'Literal[raw="null"]', message = "No null (§5.3): use undefined. NULL only in infrastructure/sqlite/." },
  { selector = "TSNullKeyword", message = "No null type (§5.3): use T | undefined or an optional property." },
  { selector = "TryStatement", message = "try/catch only in infrastructure/ (§5.3): return a Result (or use fromPromise)." },
] }

[[lint.overrides]]
files = ["apps/server/src/infrastructure/**/*.ts"]
rules = { "no-restricted-syntax" = [
  "error",
  { selector = "ClassDeclaration", message = "No classes (§5.3): use curried factories and closures." },
  { selector = "ClassExpression", message = "No classes (§5.3): use curried factories and closures." },
  { selector = 'Literal[raw="null"]', message = "No null (§5.3): use undefined. NULL only in infrastructure/sqlite/." },
  { selector = "TSNullKeyword", message = "No null type (§5.3): use T | undefined or an optional property." },
] }

[[lint.overrides]]
files = ["apps/server/src/infrastructure/sqlite/**/*.ts"]
rules = { "no-restricted-syntax" = [
  "error",
  { selector = "ClassDeclaration", message = "No classes (§5.3): use curried factories and closures." },
  { selector = "ClassExpression", message = "No classes (§5.3): use curried factories and closures." },
] }

# ── Shared i18n (§26.2): strings and pure helpers, no React, no DOM ────────────

[[lint.overrides]]
files = ["packages/i18n/**/*.ts"]
rules = { "no-restricted-imports" = [
  "error",
  { patterns = [
    { regex = '^(?!\.{1,2}/|@projo/shared(?:/|$)|i18next$|bun:test$)', message = "packages/i18n imports only @projo/shared and i18next (its TFunction): shared by the web and the mobile app, no React, no DOM (§26.2)." },
  ] },
] }

# ── Player logic (@projo/player): shared by every engine and app, no DOM, no React ──

[[lint.overrides]]
files = ["packages/player/**/*.ts"]
rules = { "no-restricted-imports" = [
  "error",
  { patterns = [
    { regex = '^(?!\.{1,2}/|@projo/shared(?:/|$)|bun:test$)', message = "packages/player imports only @projo/shared (and bun:test in tests): pure playback logic for the web, desktop and mobile engines, no DOM, no React, Hermes-safe." },
  ] },
] }

# ── Web, mobile, the desktop's bundled UI (§26.2: the same rules) ─────────────────────

[[lint.overrides]]
files = [
  "apps/web/**/*.ts",
  "apps/web/**/*.tsx",
  "packages/web-app/**/*.ts",
  "packages/web-app/**/*.tsx",
  "apps/mobile/**/*.ts",
  "apps/mobile/**/*.tsx",
  "apps/desktop/web/**/*.ts",
  "apps/desktop/web/**/*.tsx",
]
[lint.overrides.rules]
"no-restricted-imports" = [
  "error",
  { patterns = [
    { group = ["@projo/server", "@projo/server/*"], allowTypeImports = true, message = "The apps only import types from the server (AppType): no server code in a client bundle." },
  ] },
]
"react/rules-of-hooks" = "error"
"react/exhaustive-deps" = "warn"
"react/static-components" = "error"
"react/use-memo" = "error"
"react/void-use-memo" = "error"
"react/preserve-manual-memoization" = "error"
"react/incompatible-library" = "warn"
"react/immutability" = "error"
"react/globals" = "error"
"react/refs" = "error"
"react/set-state-in-effect" = "error"
"react/error-boundaries" = "error"
"react/purity" = "error"
"react/set-state-in-render" = "error"
"react/unsupported-syntax" = "warn"
"react/config" = "error"
"react/gating" = "error"

# The browser host (apps/web): no desktop-only code in the browser bundle (§28). Repeats the
# @projo/server rule above, which this override replaces for apps/web.
[[lint.overrides]]
files = ["apps/web/**/*.ts", "apps/web/**/*.tsx"]
rules = { "no-restricted-imports" = [
  "error",
  { patterns = [
    { group = ["@projo/server", "@projo/server/*"], allowTypeImports = true, message = "The apps only import types from the server (AppType): no server code in a client bundle." },
    { group = ["@projo/web-app/engines/mpv", "@projo/web-app/desktop/*"], message = "The browser host never loads desktop-only code (Tauri, libmpv): it stays out of the browser bundle." },
  ] },
] }

# TRANSITIONAL (§28): apps/web/src/desktop-compat/, a separate chunk for desktop apps older than
# the bundled-UI release, may import @projo/web-app/desktop/*, never the mpv engine. Removed once
# those desktop apps are gone.
[[lint.overrides]]
files = ["apps/web/src/desktop-compat/**/*.ts", "apps/web/src/desktop-compat/**/*.tsx"]
rules = { "no-restricted-imports" = [
  "error",
  { patterns = [
    { group = ["@projo/server", "@projo/server/*"], allowTypeImports = true, message = "The apps only import types from the server (AppType): no server code in a client bundle." },
    { group = ["@projo/web-app/engines/mpv"], message = "TRANSITIONAL desktop-compat (old desktop apps, §28): window buttons, update banner and About only, never the mpv engine." },
  ] },
] }
