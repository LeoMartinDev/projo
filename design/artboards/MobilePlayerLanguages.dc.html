<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Projo — Mobile, sous-titres et audio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000000}
a{color:#F4F4F5}a:hover{color:#FFFFFF}
:focus-visible{outline:2px solid #F4F4F5;outline-offset:3px}
@keyframes drift{from{transform:scale(1.02) translateX(0)}to{transform:scale(1.06) translateX(-1.5%)}}
@keyframes menuIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.scene{animation:drift 30s ease-in-out infinite alternate}
.menu{animation:menuIn .38s cubic-bezier(.2,.7,.2,1) both}
.panel[data-active="true"]{animation:viewIn .32s cubic-bezier(.2,.7,.2,1) both}
.ctl{transition:background-color .2s ease,transform .2s ease}
.ctl:hover{background:rgba(255,255,255,.1)}
.ctl:active{transform:scale(.94)}
.mclose{transition:background-color .2s ease,color .2s ease,transform .2s ease}
.mclose:hover{background:rgba(255,255,255,.14)!important;color:#F4F4F5!important}
.mclose:active{transform:scale(.94)}
.opt{transition:background-color .2s ease}
.opt:hover{background:rgba(255,255,255,.06)}
.opt[aria-checked="true"]{background:rgba(255,255,255,.12)}
.check{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both}
.seg{transition:color .25s ease}
.seg:hover:not(:disabled){color:#E4E4E7}
.seg[aria-checked="true"],.seg[aria-selected="true"]{color:#F4F4F5}
.seg:disabled,.step:disabled{cursor:default}
.segind{transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.step{transition:background-color .2s ease,transform .2s ease}
.step:hover:not(:disabled){background:rgba(255,255,255,.1)}
.step:active:not(:disabled){transform:scale(.94)}
.style{transition:opacity .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #F4F4F5; font-family: 'Geist', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 156px; height: 219px; overflow: hidden;">
    <div class="scene" style="position: absolute; inset: 0; background: radial-gradient(30% 40% at 66% 38%, rgba(242,181,68,.38) 0%, rgba(242,181,68,0) 70%), linear-gradient(180deg, #3A5570 0%, #1D3044 52%, #0C141E 100%);">
      <svg viewBox="0 0 1440 400" preserveAspectRatio="none" style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 50%;"><path d="M0 110 C 220 70, 380 150, 600 112 S 980 60, 1200 100 S 1380 128, 1440 100 L 1440 400 L 0 400 Z" fill="#132232" fill-opacity="0.85"></path><path d="M0 220 C 260 180, 460 250, 760 210 S 1220 170, 1440 214 L 1440 400 L 0 400 Z" fill="#0A1119"></path></svg>
      <svg viewBox="0 0 60 220" style="position: absolute; left: 22%; bottom: 44%; width: 3.2%; height: auto;"><path d="M22 0 h16 l4 200 h-24 z" fill="#0B141D"></path><rect x="20" y="6" width="20" height="14" fill="#F2D49A"></rect></svg>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: 16px; background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 100%);">
    <a class="ctl" href="MobileSeries.dc.html" aria-label="Quitter la lecture" style="width: 44px; height: 44px; border-radius: 999px; color: #F4F4F5; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
  </div>

  <div class="menu" role="dialog" aria-label="Sous-titres et audio" style="position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 6; display: flex; flex-direction: column; max-height: min(70%, 520px); overflow: hidden; border-radius: 22px; background: linear-gradient(180deg, rgba(34,34,40,.66), rgba(18,18,22,.74)); -webkit-backdrop-filter: blur(44px) saturate(180%) brightness(.58); backdrop-filter: blur(44px) saturate(180%) brightness(.58); box-shadow: inset 0 0 0 1px rgba(255,255,255,.11), inset 0 1px 0 rgba(255,255,255,.18), 0 24px 70px rgba(0,0,0,.5); transform-origin: 85% 100%;">
    <div style="display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 6px 6px 8px;">
      <div role="tablist" aria-label="Sous-titres et audio" style="position: relative; display: grid; flex: 1 1 auto; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; height: 36px; padding: 3px; box-sizing: border-box; border-radius: 13px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);">
        <span class="segind" aria-hidden="true" style="position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 2); border-radius: 10px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 2px 8px rgba(0,0,0,.25); transform: translateX({{tabShift}}); pointer-events: none;"></span>
        <button class="seg" type="button" role="tab" id="m-tab-audio" aria-controls="m-panel-audio" aria-selected="{{audioSelected}}" onClick="{{showAudio}}" style="position: relative; z-index: 1; min-width: 0; padding: 0 2px; border: 0; border-radius: 10px; background: transparent; color: #A1A1AA; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Audio</button>
        <button class="seg" type="button" role="tab" id="m-tab-subs" aria-controls="m-panel-subs" aria-selected="{{subsSelected}}" onClick="{{showSubs}}" style="position: relative; z-index: 1; min-width: 0; padding: 0 2px; border: 0; border-radius: 10px; background: transparent; color: #A1A1AA; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Sous-titres</button>
      </div>
      <a class="mclose" href="MobileSeries.dc.html" aria-label="Fermer" style="display: flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,.07); color: #A1A1AA;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: grid; flex: 0 1 auto; grid-template-rows: minmax(0, 1fr); min-height: 0;">
      <div class="panel" id="m-panel-audio" role="tabpanel" aria-labelledby="m-tab-audio" data-active="{{audioSelected}}" style="display: flex; flex-direction: column; grid-area: 1 / 1; min-height: 0; visibility: {{audioVisibility}};">
        <div role="radiogroup" aria-label="Audio" style="display: flex; flex: 1 1 auto; flex-direction: column; gap: 2px; min-height: 0; padding: 2px 8px 8px; overflow-y: auto;">
          <sc-for list="{{audio}}" as="o" hint-placeholder-count="3">
            <button class="opt" type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; flex: 0 0 auto; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 6px 10px 6px 12px; border: 0; border-radius: 12px; background: transparent; color: #F4F4F5; font-family: inherit; text-align: left; cursor: pointer;">
              <span style="display: flex; flex: 1 1 auto; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="min-width: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap;">{{o.label}}</span>
                <span style="overflow: hidden; color: #8B8B94; font-size: 12px; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap;">{{o.detail}}</span>
              </span>
              <span aria-hidden="true" style="display: flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 20px; height: 20px; color: #FFFFFF;">
                <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              </span>
            </button>
          </sc-for>
        </div>
      </div>

      <div class="panel" id="m-panel-subs" role="tabpanel" aria-labelledby="m-tab-subs" data-active="{{subsSelected}}" style="display: flex; flex-direction: column; grid-area: 1 / 1; min-height: 0; visibility: {{subsVisibility}};">
        <div role="radiogroup" aria-label="Sous-titres" style="display: flex; flex: 1 1 auto; flex-direction: column; gap: 2px; min-height: 0; padding: 2px 8px 8px; overflow-y: auto;">
          <sc-for list="{{subtitles}}" as="o" hint-placeholder-count="6">
            <button class="opt" type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; flex: 0 0 auto; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 6px 10px 6px 12px; border: 0; border-radius: 12px; background: transparent; color: #F4F4F5; font-family: inherit; text-align: left; cursor: pointer;">
              <span style="display: flex; flex: 1 1 auto; flex-direction: column; gap: 2px; min-width: 0;">
                <span style="display: flex; align-items: center; gap: 8px; min-width: 0;">
                  <span style="min-width: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap;">{{o.label}}</span>
                  <sc-for list="{{o.tags}}" as="tag" hint-placeholder-count="0">
                    <span style="display: inline-flex; flex: 0 0 auto; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); color: #D4D4D8; font-size: 11px; font-weight: 600; letter-spacing: 0.02em;">{{tag}}</span>
                  </sc-for>
                </span>
                <sc-if value="{{o.hasDetail}}" hint-placeholder-val="{{false}}">
                  <span style="overflow: hidden; color: #8B8B94; font-size: 12px; text-overflow: ellipsis; white-space: nowrap;">{{o.detail}}</span>
                </sc-if>
              </span>
              <span aria-hidden="true" style="display: flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 20px; height: 20px; color: #FFFFFF;">
                <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg class="check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              </span>
            </button>
          </sc-for>
        </div>

        <div class="style" style="display: grid; flex: 0 0 auto; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 4px 8px 8px; padding: 6px; border-radius: 14px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); opacity: {{styleOpacity}};">
          <div role="radiogroup" aria-label="Taille" style="position: relative; display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; height: 40px; padding: 3px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);">
            <span class="segind" aria-hidden="true" style="position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 4); border-radius: 8px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 2px 8px rgba(0,0,0,.25); transform: translateX({{sizeShift}}); pointer-events: none;"></span>
            <sc-for list="{{sizes}}" as="s" hint-placeholder-count="4">
              <button class="seg" type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" title="{{s.name}}" disabled="{{subsOff}}" onClick="{{s.pick}}" style="position: relative; z-index: 1; min-width: 0; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #A1A1AA; font-family: inherit; font-size: {{s.font}}; font-weight: 600; line-height: 1; cursor: pointer;">A</button>
            </sc-for>
          </div>
          <div style="display: flex; align-items: center; gap: 2px; height: 40px; padding: 2px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);">
            <button class="step" type="button" aria-label="Afficher plus tôt" disabled="{{subsOff}}" onClick="{{earlier}}" style="display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: #F4F4F5; cursor: pointer;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <button class="step" type="button" aria-label="{{delayResetLabel}}" disabled="{{subsOff}}" onClick="{{resetDelay}}" style="display: inline-flex; flex: 1 1 auto; align-items: center; justify-content: center; min-width: 0; height: 36px; border: 0; border-radius: 9px; background: transparent; color: {{delayColor}}; font-family: inherit; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; cursor: pointer;">{{delayText}}</button>
            <button class="step" type="button" aria-label="Afficher plus tard" disabled="{{subsOff}}" onClick="{{later}}" style="display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: #F4F4F5; cursor: pointer;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'subtitles', audio: 0, subtitle: 2, size: 1, delayMs: 0 };
  }
  renderVals() {
    const audioTracks = [
      ['Français', '5.1 · Dolby Digital Plus'],
      ['Français', 'Audiodescription · Stéréo · AAC'],
      ['Anglais', 'Stéréo · AAC']
    ];
    const subtitleTracks = [
      ['Désactivés', [], ''],
      ['Français', ['Forcés'], ''],
      ['Français', [], ''],
      ['Français', ['SDH'], ''],
      ['Anglais', [], 'Fichier à part'],
      ['Anglais', [], 'Dans la vidéo']
    ];
    const sizes = [['Petite', 11], ['Normale', 13], ['Grande', 16], ['Très grande', 19]];
    const onSubs = this.state.tab === 'subtitles';
    const subsOff = this.state.subtitle === 0;
    const delay = this.state.delayMs;
    const seconds = String(Math.abs(delay) / 1000).replace('.', ',');
    const delayText = (delay > 0 ? '+' : delay < 0 ? '−' : '') + seconds + ' s';
    const shift = (step) => {
      const next = step === 0 ? 0 : Math.min(10000, Math.max(-10000, this.state.delayMs + step));
      this.setState({ delayMs: next });
    };
    return {
      tabShift: onSubs ? '100%' : '0%',
      audioSelected: onSubs ? 'false' : 'true',
      subsSelected: onSubs ? 'true' : 'false',
      audioVisibility: onSubs ? 'hidden' : 'visible',
      subsVisibility: onSubs ? 'visible' : 'hidden',
      showAudio: () => this.setState({ tab: 'audio' }),
      showSubs: () => this.setState({ tab: 'subtitles' }),
      audio: audioTracks.map((track, index) => ({
        label: track[0],
        detail: track[1],
        on: index === this.state.audio,
        checked: index === this.state.audio ? 'true' : 'false',
        pick: () => this.setState({ audio: index })
      })),
      subtitles: subtitleTracks.map((track, index) => ({
        label: track[0],
        tags: track[1],
        detail: track[2],
        hasDetail: track[2] !== '',
        on: index === this.state.subtitle,
        checked: index === this.state.subtitle ? 'true' : 'false',
        pick: () => this.setState({ subtitle: index })
      })),
      sizes: sizes.map((size, index) => ({
        name: size[0],
        font: size[1] + 'px',
        checked: index === this.state.size ? 'true' : 'false',
        pick: () => this.setState({ size: index })
      })),
      sizeShift: this.state.size * 100 + '%',
      subsOff,
      styleOpacity: subsOff ? 0.38 : 1,
      delayText,
      delayColor: delay === 0 ? '#A1A1AA' : '#F4F4F5',
      delayResetLabel: 'Décalage ' + delayText + ', remettre à zéro',
      earlier: () => shift(-250),
      later: () => shift(250),
      resetDelay: () => shift(0)
    };
  }
}
</script>
</body>
</html>
