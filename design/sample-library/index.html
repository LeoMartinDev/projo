ay:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 20px}.card{border:0;padding:0;margin:0;background:none;text-align:left;color:inherit;min-width:0;cursor:pointer;border-radius:14px}.art{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:13px;background:#141416}.art:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px #ffffff12;border-radius:inherit;pointer-events:none}.card img{display:block;width:100%;height:100%;object-fit:cover}.card[aria-pressed=true] .art{outline:2px solid #ffffffb3;outline-offset:4px}.card-title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:13px;color:#d4d4d8;font-size:16px;font-weight:500}.progress{position:absolute;left:12px;right:12px;bottom:10px;height:3px;background:#ffffff33;border-radius:9px;overflow:hidden}.progress>span{display:block;height:100%;width:var(--progress);background:#f4f4f5;border-radius:inherit}.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.frame{margin:0;min-width:0}.frame a{display:block;border-radius:13px;overflow:hidden;aspect-ratio:16/9;background:#141416}.frame img{display:block;width:100%;height:100%;object-fit:cover}.frame figcaption{margin-top:11px;font:13px 'Geist Mono',monospace;color:var(--muted)}@media(min-width:1700px){.hero{height:820px}.hero-content{bottom:140px}}@media(max-width:850px){.hero{height:660px}.hero-content{bottom:80px}.hero>img{object-position:65% center}.films{grid-template-columns:repeat(2,minmax(0,1fr))}.overview{font-size:16px}.frames{gap:12px}}@media(max-width:480px){header{padding-top:22px}.hero{height:670px}.hero-content{bottom:60px}.hero:after{background:linear-gradient(0deg,var(--bg),#0a0a0ba6 45%,#0a0a0b22 85%)}h1{font-size:52px}.meta{font-size:13px}.overview{height:72px;font-size:15px}.action{padding:0 17px;height:48px}.films{gap:22px 14px}.card-title{font-size:14px}.frames{grid-template-columns:1fr}.frame img{object-fit:cover}h2{font-size:21px}.hero>img{object-position:65% 30%}}
</style>

<body>
<header><a class="brand" href="index.html" aria-label="projo. — Films et séries">projo.</a></header>
<div class="hero">
<img id="hero-image" src="assets/nord.webp" alt="" fetchpriority="high" width="1600" height="900">
<div class="hero-content">
<h1 id="hero-title">Nord</h1>
<div class="meta" id="hero-meta"></div>
<p class="overview" id="hero-overview"></p>
<div class="actions"><a class="action primary" href="#catalogue">Voir les images</a><a class="action" id="open-image" href="assets/nord.webp" target="_blank" rel="noopener">Ouvrir le visuel ↗</a></div>
</div>
</div>
<main>
<section aria-labelledby="catalogue"><h2 id="catalogue">Films et séries</h2><div class="films" id="films"></div></section>
<section aria-labelledby="timeline-title"><h2 id="timeline-title">Nord · Épisode 1</h2><div class="frames" id="frames"></div></section>
</main>
<script id="sample-catalog" type="application/json">{"generated":"2026-11-05","generator":"Built-in ImageGen","fictional":true,"items":[{"id":"nord","title":"Nord","kind":"series","genre":"Aventure, mystère","meta":"Série · 2 saisons","year":2026,"overview":"Une guide de haute montagne rejoint un refuge scientifique dont les occupants ne répondent plus.","tint":"#202830","progress":0.64,"images":{"backdrop":"assets/nord.webp","thumbnail":"thumbnails/nord.webp"}},{"id":"marees","title":"Les Marées basses","kind":"series","genre":"Drame, policier","meta":"Série · 2 saisons","year":2025,"overview":"Sur une île de l’Atlantique, une garde-côte enquête sur un bateau revenu au port sans son équipage.","tint":"#13283B","progress":0.42,"images":{"backdrop":"assets/marees.webp","thumbnail":"thumbnails/marees.webp"}},{"id":"minuit","title":"Minuit à Fourvière","kind":"movie","genre":"Thriller, policier","meta":"Film · 1 h 48","year":2026,"overview":"Dans le dernier tramway, un homme comprend que la personne qui le suit connaît sa destination.","tint":"#1C1634","progress":0.27,"images":{"backdrop":"assets/minuit.webp","thumbnail":"thumbnails/minuit.webp"}},{"id":"orbite","title":"Orbite basse","kind":"movie","genre":"Science-fiction, drame","meta":"Film · 1 h 56","year":2026,"overview":"Seule à bord d’une station qui perd le contact avec la Terre, une astronaute reçoit une transmission inattendue.","tint":"#181B33","progress":0.76,"images":{"backdrop":"assets/orbite.webp","thumbnail":"thumbnails/orbite.webp"}},{"id":"ferry","title":"Le Dernier Ferry","kind":"movie","genre":"Drame","meta":"Film · 1 h 42","year":2025,"overview":"Un père et sa fille se retrouvent sur la dernière traversée de l’automne, après des années de silence.","tint":"#1C2C38","progress":0.34,"images":{"backdrop":"assets/ferry.webp","thumbnail":"thumbnails/ferry.webp"}},{"id":"tilleuls","title":"Sous les tilleuls","kind":"movie","genre":"Comédie, famille","meta":"Film · 1 h 38","year":2026,"overview":"Un déjeuner de famille qui devait durer une heure se prolonge jusqu’au soir, avec ses secrets et ses retrouvailles.","tint":"#1C2413","progress":0.58,"images":{"backdrop":"assets/tilleuls.webp","thumbnail":"thumbnails/tilleuls.webp"}},{"id":"lanternes","title":"Le Vent des lanternes","kind":"series","genre":"Animation, fantastique","meta":"Série · 1 saison","year":2025,"overview":"Dans une ville de montagne, une jeune femme lâche chaque soir une lanterne dans le vent, jusqu’au jour où l’une d’elles revient.","tint":"#1A1B2E","progress":0.5,"images":{"backdrop":"assets/lanternes.webp","thumbnail":"thumbnails/lanternes.webp"}}],"timeline":[{"id":"nord","timeMs":260000,"label":"00:04:20","src":"timeline/nord-ridge.webp"},{"id":"nord-refuge","timeMs":1050000,"label":"00:17:30","src":"timeline/nord-refuge.webp"},{"id":"nord-interieur","timeMs":1860000,"label":"00:31:00","src":"timeline/nord-interieur.webp"}]}</script>
<script>
const catalog=JSON.parse(document.getElementById('sample-catalog').textContent);
const films=document.getElementById('films');
function select(item){
document.getElementById('hero-image').src=item.images.backdrop;
document.getElementById('hero-title').textContent=item.title;
document.getElementById('hero-meta').textContent=item.meta+' · '+item.genre;
document.getElementById('hero-overview').textContent=item.overview;
document.getElementById('open-image').href=item.images.backdrop;
for(const card of films.querySelectorAll('button'))card.setAttribute('aria-pressed',String(card.dataset.id===item.id));
}
for(const item of catalog.items){
const card=document.createElement('button');card.className='card';card.type='button';card.dataset.id=item.id;card.setAttribute('aria-label','Afficher '+item.title);card.setAttribute('aria-pressed','false');
const art=document.createElement('span');art.className='art';
const img=document.createElement('img');img.src=item.images.thumbnail;img.alt='';img.width=640;img.height=360;img.loading='lazy';
const progress=document.createElement('span');progress.className='progress';progress.setAttribute('aria-hidden','true');progress.style.setProperty('--progress',String(item.progress*100)+'%');progress.append(document.createElement('span'));
art.append(img,progress);
const title=document.createElement('span');title.className='card-title';title.textContent=item.title;
card.append(art,title);card.addEventListener('click',()=>select(item));films.append(card);
}
for(const frame of catalog.timeline){
const figure=document.createElement('figure');figure.className='frame';
const link=document.createElement('a');link.href='assets/'+frame.id+'.webp';link.target='_blank';link.rel='noopener';link.setAttribute('aria-label','Ouvrir le plan de Nord à '+frame.label);
const img=document.createElement('img');img.src=frame.src;img.width=320;img.height=180;img.alt=frame.id==='nord'?'La guide face au massif':frame.id==='nord-refuge'?'La guide rejoint le refuge':'La guide écoute la radio dans le refuge';img.loading='lazy';
const caption=document.createElement('figcaption');caption.textContent=frame.label;link.append(img);figure.append(link,caption);document.getElementById('frames').append(figure);
}
select(catalog.items[0]);
</script>
</body>
