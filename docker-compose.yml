# projo, ready to install (README.md "Installation"): copy this file into an empty folder, add
# your media folders below, then `docker compose up -d` (or a Container Manager project on a
# Synology).
# To build the image from the sources instead: docker build -f runtime/Dockerfile -t projo:dev .
services:
  projo:
    image: ghcr.io/leomartindev/projo:latest
    # Optional: run as the user that owns your media (`id` gives it; Synology: often 1026:100).
    # The data folder must then belong to that user.
    # user: '1026:100'
    ports:
      - '8080:8080'
    volumes:
      # Everything projo writes (database, images, caches, app versions): the folder to back up.
      - ./projo-data:/data
      # Your media, read-only: uncomment and fill in one line per folder, `<on this machine>:<in
      # projo>:ro`. You pick them under /media in the setup wizard.
      #   Linux:              /srv/videos:/media/videos:ro
      #   Synology folder:    /volume1/video:/media/video:ro
      #   Synology USB disk:  /volumeUSB1/usbshare:/media/usb:ro
      # - :/media/videos:ro
    # Optional, Intel iGPU hardware transcoding (Administration > Playback): uncomment both. The
    # number is the group owning /dev/dri/renderD128 on this machine (README "Hardware transcoding").
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # group_add:
    #   - '' # e.g. '937' on Synology DSM
    environment:
      - TRUST_PROXY=false # true behind a reverse proxy (Caddy, Traefik, NPM, DSM)
    # The supervisor gives the app 25 s to stop before killing it.
    stop_grace_period: 30s
    restart: unless-stopped
